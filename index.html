<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForestChain</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- FLASH RELÁMPAGO -->
<div class="flash"></div>

<!-- ESCENA -->
<div class="scene">

  <div class="sky"></div>
  <div class="fog"></div>

  <!-- BOSQUE -->
  <div class="forest layer back">
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
  </div>

  <div class="forest layer mid">
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
    <div class="tree"></div><div class="tree"></div>
  </div>

  <div class="forest layer front">
    <div class="tree"></div><div class="tree"></div><div class="tree"></div>
  </div>

</div>

<canvas id="rain"></canvas>

<!-- CONTENIDO -->
<div class="content">
  <h1>ForestChain</h1>
  <p>Invierte en el futuro bajo la naturaleza.</p>
  <button>Acceso temprano</button>
</div>

<script src="rain.js"></script>

</body>
</html>
