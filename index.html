<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForestChain IPOP</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Flash de relámpago -->
<div class="flash"></div>

<div class="environment">
  <div class="sky"></div>
  <div class="fog"></div>

  <!-- BOSQUE -->
  <div class="forest layer1">
    <svg viewBox="0 0 800 300">
      <polygon points="20,300 50,160 80,300" fill="#0b1c17"/>
      <polygon points="120,300 150,140 180,300" fill="#0b1c17"/>
      <polygon points="220,300 250,170 280,300" fill="#0b1c17"/>
      <polygon points="320,300 350,150 380,300" fill="#0b1c17"/>
      <polygon points="420,300 450,160 480,300" fill="#0b1c17"/>
      <polygon points="520,300 550,140 580,300" fill="#0b1c17"/>
      <polygon points="620,300 650,170 680,300" fill="#0b1c17"/>
      <polygon points="720,300 750,150 780,300" fill="#0b1c17"/>
    </svg>
  </div>

  <div class="forest layer2">
    <svg viewBox="0 0 800 300">
      <polygon points="60,300 90,180 120,300" fill="#12322b"/>
      <polygon points="180,300 210,150 240,300" fill="#12322b"/>
      <polygon points="300,300 330,170 360,300" fill="#12322b"/>
      <polygon points="420,300 450,140 480,300" fill="#12322b"/>
      <polygon points="540,300 570,180 600,300" fill="#12322b"/>
      <polygon points="660,300 690,150 720,300" fill="#12322b"/>
    </svg>
  </div>

  <div class="forest layer3">
    <svg viewBox="0 0 800 300">
      <polygon points="100,300 130,160 160,300" fill="#1a4b35"/>
      <polygon points="250,300 280,140 310,300" fill="#1a4b35"/>
      <polygon points="400,300 430,170 460,300" fill="#1a4b35"/>
      <polygon points="550,300 580,130 610,300" fill="#1a4b35"/>
      <polygon points="700,300 730,160 760,300" fill="#1a4b35"/>
    </svg>
  </div>
</div>

<canvas id="rain"></canvas>

<main>
  <section class="glass">
    <h1>ForestChain IPOP</h1>
    <p>Invierte en el futuro bajo el bosque lluvioso.</p>
    <button class="cta">Unirse al Acceso Temprano</button>
  </section>
</main>

<script src="rain.js"></script>

</body>
</html>
