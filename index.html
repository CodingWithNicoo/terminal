<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForestChain IPOP</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="environment">
  <div class="sky"></div>
  <div class="fog"></div>

  <!-- Bosque capas -->
  <div class="forest layer1">
    <svg viewBox="0 0 800 300">
      <polygon points="0,300 50,120 100,300" fill="#0b1c17"/>
      <polygon points="150,300 175,100 200,300" fill="#0b1c17"/>
      <polygon points="300,300 325,110 350,300" fill="#0b1c17"/>
    </svg>
  </div>

  <div class="forest layer2">
    <svg viewBox="0 0 800 300">
      <polygon points="50,300 80,150 110,300" fill="#12322b"/>
      <polygon points="200,300 230,130 260,300" fill="#12322b"/>
      <polygon points="400,300 430,150 460,300" fill="#12322b"/>
    </svg>
  </div>

  <div class="forest layer3">
    <svg viewBox="0 0 800 300">
      <polygon points="100,300 130,170 160,300" fill="#1a4b35"/>
      <polygon points="300,300 330,140 360,300" fill="#1a4b35"/>
      <polygon points="500,300 530,160 560,300" fill="#1a4b35"/>
    </svg>
  </div>
</div>

<canvas id="rain"></canvas>

<main>
  <section class="glass">
    <h1>ForestChain IPOP</h1>
    <p>Invierte en el futuro bajo el bosque lluvioso.</p>
    <button class="cta">Unirse al Acceso Temprano</button>
  </section>
</main>

<!-- JS -->
<script src="rain.js"></script>

</body>
</html>
